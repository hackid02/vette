<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <!-- background -->
  <rect width="1500" height="500" fill="#0A0D0B"/>
  <!-- dot grid -->
  <g fill="#E4E7DF" fill-opacity="0.05">
    <circle cx="60" cy="60" r="1.5"/><circle cx="140" cy="60" r="1.5"/><circle cx="220" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="380" cy="60" r="1.5"/>
    <circle cx="60" cy="140" r="1.5"/><circle cx="140" cy="140" r="1.5"/><circle cx="220" cy="140" r="1.5"/><circle cx="300" cy="140" r="1.5"/><circle cx="380" cy="140" r="1.5"/>
    <circle cx="1180" cy="100" r="1.5"/><circle cx="1260" cy="100" r="1.5"/><circle cx="1340" cy="100" r="1.5"/><circle cx="1420" cy="100" r="1.5"/>
    <circle cx="1180" cy="200" r="1.5"/><circle cx="1260" cy="200" r="1.5"/><circle cx="1340" cy="200" r="1.5"/><circle cx="1420" cy="200" r="1.5"/>
    <circle cx="1180" cy="380" r="1.5"/><circle cx="1260" cy="380" r="1.5"/><circle cx="1340" cy="380" r="1.5"/><circle cx="1420" cy="380" r="1.5"/>
  </g>
  <!-- lime accent line -->
  <rect x="0" y="470" width="1500" height="3" fill="#C6FF4A" fill-opacity="0.6"/>

  <!-- shield -->
  <g transform="translate(96,108)">
    <path d="M60 6 L156 44 V140 C156 230 100 300 60 336 C20 300 -36 230 -36 140 V44 Z" fill="#C6FF4A"/>
    <path d="M24 178 L54 210 L98 150" stroke="#0A0D0B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- wordmark -->
  <text x="270" y="232" font-family="DejaVu Sans, sans-serif" font-size="128" font-weight="bold" fill="#C6FF4A" letter-spacing="14">VETTE</text>
  <text x="282" y="308" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="bold" fill="#E4E7DF" letter-spacing="26">AGENTS</text>

  <!-- divider -->
  <rect x="272" y="344" width="440" height="2" fill="#1E241F"/>

  <!-- tagline -->
  <text x="282" y="398" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#7E857C">the agent that vets agents</text>

  <!-- right side: verdict dots + URL -->
  <g transform="translate(1020,150)">
    <circle cx="12" cy="0" r="7" fill="#C6FF4A"/>
    <text x="30" y="7" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#7E857C">COMPLIANT</text>
    <circle cx="182" cy="0" r="7" fill="#FFB020"/>
    <text x="200" y="7" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#7E857C">DEVIATED</text>
    <circle cx="352" cy="0" r="7" fill="#FF5A65"/>
    <text x="370" y="7" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#7E857C">DANGEROUS</text>
  </g>
  <text x="1020" y="300" font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#7E857C">every claim → a tool call</text>
  <text x="1020" y="340" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#C6FF4A">vette-nu.vercel.app</text>
</svg>
