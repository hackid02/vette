<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="760" height="520" fill="#0A0D0B"/>
  <!-- title -->
  <text x="30" y="38" fill="#C6FF4A" font-size="15" font-weight="bold">VETTE — deterministic engine first. narration last. nothing invented.</text>

  <!-- input -->
  <rect x="250" y="58" width="260" height="44" rx="6" fill="#10140F" stroke="#1E241F"/>
  <text x="275" y="85" fill="#E4E7DF" font-size="13">INPUT · URL / wallet / mandate</text>

  <!-- arrow -->
  <line x1="380" y1="102" x2="380" y2="122" stroke="#1E241F" stroke-width="2"/>
  <polygon points="380,130 375,120 385,120" fill="#1E241F"/>

  <!-- engine box -->
  <rect x="90" y="134" width="580" height="186" rx="8" fill="#10140F" stroke="#C6FF4A" stroke-opacity="0.35"/>
  <text x="115" y="162" fill="#C6FF4A" font-size="13" font-weight="bold">DETERMINISTIC ENGINE</text>
  <text x="115" y="186" fill="#7E857C" font-size="11">fetch_website()   liveness · socials · published addresses · the agent's own words</text>
  <text x="115" y="210" fill="#7E857C" font-size="11">rpc_balance() / rpc_code()   ETH · is it a contract · Base mainnet</text>
  <text x="115" y="234" fill="#7E857C" font-size="11">explorer_transactions() / token_transfers()   what it actually did</text>
  <text x="115" y="258" fill="#7E857C" font-size="11">rpc_allowance()   live allowances probed onchain, right now</text>
  <text x="115" y="282" fill="#7E857C" font-size="11">rule_engine()   mandate-vs-behavior + wallet-safety heuristics</text>
  <text x="115" y="306" fill="#7E857C" font-size="11">every finding carries evidence: a tx hash, an address, or a URL</text>

  <!-- arrow -->
  <line x1="380" y1="320" x2="380" y2="340" stroke="#1E241F" stroke-width="2"/>
  <polygon points="380,348 375,338 385,338" fill="#1E241F"/>

  <!-- verdict -->
  <rect x="190" y="352" width="380" height="56" rx="6" fill="#10140F" stroke="#1E241F"/>
  <text x="220" y="376" fill="#E4E7DF" font-size="13" font-weight="bold">VERDICT · score /100 · plain English</text>
  <text x="220" y="396" fill="#7E857C" font-size="11">COMPLIANT / DEVIATED / DANGEROUS / UNVERIFIABLE — every sentence cites a check</text>

  <!-- arrow -->
  <line x1="380" y1="408" x2="380" y2="428" stroke="#1E241F" stroke-width="2"/>
  <polygon points="380,436 375,426 385,426" fill="#1E241F"/>

  <!-- receipt -->
  <rect x="130" y="440" width="500" height="56" rx="6" fill="#10140F" stroke="#C6FF4A" stroke-opacity="0.35"/>
  <text x="160" y="464" fill="#C6FF4A" font-size="13" font-weight="bold">PUBLIC RECEIPT · every tool call · real input · real output</text>
  <text x="160" y="484" fill="#7E857C" font-size="11">verified by a deterministic engine, not vibes</text>
</svg>
